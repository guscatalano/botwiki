# Drop-in that lets the web UI bind a privileged port, so the wiki answers on a
# hostname alone instead of a hostname and a port number.
#
#   mkdir -p /etc/systemd/system/botwiki-web.service.d
#   cp botwiki-web-lowport.conf /etc/systemd/system/botwiki-web.service.d/lowport.conf
#   echo 'WIKI_EXTRA_PORTS=80' >> /etc/botwiki.env
#   systemctl daemon-reload && systemctl restart botwiki-web
#
# Only install this if WIKI_EXTRA_PORTS names a port below 1024. The service
# runs as an unprivileged user and should keep no capability it does not use —
# a public instance sits behind Caddy on 8787 and needs none of this.
#
# Without the drop-in the extra listener fails with EACCES, which is logged and
# then ignored: the wiki still starts and still answers on WIKI_PORT.

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
